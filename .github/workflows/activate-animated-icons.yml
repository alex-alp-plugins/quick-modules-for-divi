name: Activate animated WordPress.org icons

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  activate:
    if: contains(github.event.head_commit.message, '[activate-animated-icons]')
    runs-on: ubuntu-latest
    env:
      SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
      WPORG_SLUG: alp-quick-modules-for-divi

    steps:
      - name: Install Subversion
        run: sudo apt-get update -y && sudo apt-get install -y subversion

      - name: Verify animated GIFs and remove static PNG icons
        shell: bash
        run: |
          set -euo pipefail
          svn checkout "https://plugins.svn.wordpress.org/$WPORG_SLUG/" /tmp/wporg             --username "$SVN_USERNAME"             --password "$SVN_PASSWORD"             --non-interactive

          cd /tmp/wporg

          sha256sum assets/icon-128x128.gif assets/icon-256x256.gif
          echo "e2ccf37bf3402f4d17b286d93401b3299d6903cc4fc6256a2067b079142ba294  assets/icon-128x128.gif" | sha256sum -c -
          echo "931cea561a6091d4c593a5353c2a008b0bdc975b762340506999d566eff153b5  assets/icon-256x256.gif" | sha256sum -c -

          test -f assets/icon-128x128.png
          test -f assets/icon-256x256.png

          svn delete assets/icon-128x128.png assets/icon-256x256.png

          CHANGES="$(svn status assets)"
          echo "$CHANGES"

          test "$(printf '%s\n' "$CHANGES" | wc -l)" -eq 2
          printf '%s\n' "$CHANGES" | grep -Fx "D       assets/icon-128x128.png"
          printf '%s\n' "$CHANGES" | grep -Fx "D       assets/icon-256x256.png"

          svn commit assets/icon-128x128.png assets/icon-256x256.png             -m "Use animated plugin icons"             --username "$SVN_USERNAME"             --password "$SVN_PASSWORD"             --non-interactive

      - name: Verify final WordPress.org icon set
        shell: bash
        run: |
          set -euo pipefail
          LIST="$(svn ls "https://plugins.svn.wordpress.org/$WPORG_SLUG/assets/")"
          echo "$LIST"

          echo "$LIST" | grep -Fx "icon-128x128.gif"
          echo "$LIST" | grep -Fx "icon-256x256.gif"

          if echo "$LIST" | grep -Eq '^icon-(128x128|256x256)\.png$'; then
            echo "::error::A static plugin icon PNG still exists."
            exit 1
          fi

          svn cat "https://plugins.svn.wordpress.org/$WPORG_SLUG/assets/icon-128x128.gif" > /tmp/icon128.gif
          svn cat "https://plugins.svn.wordpress.org/$WPORG_SLUG/assets/icon-256x256.gif" > /tmp/icon256.gif
          echo "e2ccf37bf3402f4d17b286d93401b3299d6903cc4fc6256a2067b079142ba294  /tmp/icon128.gif" | sha256sum -c -
          echo "931cea561a6091d4c593a5353c2a008b0bdc975b762340506999d566eff153b5  /tmp/icon256.gif" | sha256sum -c -
