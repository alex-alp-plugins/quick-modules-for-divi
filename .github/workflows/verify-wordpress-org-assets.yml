name: Verify WordPress.org assets

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-wporg-assets]')
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y subversion curl

      - name: Compare SVN assets with pre-release revision
        shell: bash
        run: |
          set -euo pipefail
          SLUG="alp-quick-modules-for-divi"

          rm -rf /tmp/assets-current /tmp/assets-before
          svn export "https://plugins.svn.wordpress.org/$SLUG/assets" /tmp/assets-current --force
          svn export -r 3740161 "https://plugins.svn.wordpress.org/$SLUG/assets" /tmp/assets-before --force

          echo "===== CURRENT ASSETS ====="
          find /tmp/assets-current -maxdepth 1 -type f -printf '%f|%s bytes\n' | sort
          echo

          echo "===== SHA-256 CURRENT ====="
          (cd /tmp/assets-current && sha256sum * | sort -k2)
          echo

          echo "===== SHA-256 BEFORE 1.0.6 ====="
          (cd /tmp/assets-before && sha256sum * | sort -k2)
          echo

          echo "===== DIFF CURRENT VS REV 3740161 ====="
          if diff -qr /tmp/assets-before /tmp/assets-current; then
            echo "ASSETS_MATCH_PREVIOUS_REVISION=yes"
          else
            echo "ASSETS_MATCH_PREVIOUS_REVISION=no"
          fi
          echo

          echo "===== CDN CHECK ====="
          for file in /tmp/assets-current/*; do
            name="$(basename "$file")"
            url="https://ps.w.org/$SLUG/assets/$name?rev=3740167"
            echo "--- $name"
            curl -L -sS -o "/tmp/cdn-$name" -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download} URL=%{url_effective}\n' "$url"
            if [[ -s "/tmp/cdn-$name" ]]; then
              sha256sum "/tmp/cdn-$name"
            fi
          done
