name: Deploy plugin to WordPress.org

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-wporg]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare WordPress.org package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < .wordpress-org/deploy-version.txt)"
          test -n "$VERSION"
          git rev-parse "v$VERSION" >/dev/null

          rm -rf /tmp/alp-wporg-build
          mkdir -p /tmp/alp-wporg-build

          git archive "v$VERSION" | tar -x -C /tmp/alp-wporg-build

          rm -rf             /tmp/alp-wporg-build/.github             /tmp/alp-wporg-build/.wordpress-org             /tmp/alp-wporg-build/README.md

          cp "$GITHUB_WORKSPACE/readme.txt" /tmp/alp-wporg-build/readme.txt

          grep -Eq '^Stable tag:[[:space:]]+'"$VERSION"'[[:space:]]*$' /tmp/alp-wporg-build/readme.txt
          grep -Eq '^ \* Version:[[:space:]]+'"$VERSION"'[[:space:]]*$' /tmp/alp-wporg-build/alp-quick-modules-for-divi.php
          php -l /tmp/alp-wporg-build/alp-quick-modules-for-divi.php
          php -l /tmp/alp-wporg-build/uninstall.php

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
          SLUG: alp-quick-modules-for-divi
          VERSION: ${{ env.VERSION }}
          BUILD_DIR: /tmp/alp-wporg-build
