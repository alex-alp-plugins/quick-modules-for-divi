name: Verify WordPress.org directory metadata

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-wporg-metadata]')
    runs-on: ubuntu-latest
    steps:
      - name: Check plugin directory API and live asset URLs
        shell: bash
        run: |
          set -euo pipefail
          SLUG="alp-quick-modules-for-divi"

          echo "===== PLUGIN INFO API ====="
          curl -sS --get             --data-urlencode "action=plugin_information"             --data-urlencode "request[slug]=$SLUG"             "https://api.wordpress.org/plugins/info/1.2/" > /tmp/plugin.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/plugin.json'))
          print('version=',d.get('version'))
          print('last_updated=',d.get('last_updated'))
          print('icons=',json.dumps(d.get('icons'),sort_keys=True))
          print('banners=',json.dumps(d.get('banners'),sort_keys=True))
          print('screenshots=',json.dumps((d.get('sections') or {}).get('screenshots'),ensure_ascii=False)[:4000])
          PY

          echo "===== LIVE NO-REV CDN ====="
          for name in             icon-128x128.gif icon-128x128.png icon-256x256.gif icon-256x256.png             banner-772x250.png banner-1544x500.png             screenshot-1.png screenshot-2.png screenshot-3.png screenshot-4.png screenshot-5.png screenshot-6.png; do
            url="https://ps.w.org/$SLUG/assets/$name"
            printf '%s|' "$name"
            curl -L -sS -o /tmp/live-asset -w 'HTTP=%{http_code}|TYPE=%{content_type}|SIZE=%{size_download}|URL=%{url_effective}\n' "$url"
          done

          echo "===== LIVE DIRECTORY PAGE MARKERS ====="
          curl -L -sS "https://wordpress.org/plugins/$SLUG/" > /tmp/page.html
          grep -oE 'ps\.w\.org/[^" ]+' /tmp/page.html | head -30 || true
          grep -oE 'Version[^<]{0,80}' /tmp/page.html | head -5 || true
